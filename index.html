<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Birthday 🎂</title>
<style>
:root{--p:#ff3cac;--b:#00e5ff;--y:#ffe66d}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%;background:#07040f;color:#f4eaff;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;overflow-x:hidden;scroll-behavior:smooth}
body{background:radial-gradient(circle at 20% 10%,#2a0a4a 0,transparent 45%),radial-gradient(circle at 85% 80%,#06324a 0,transparent 45%),#07040f;background-attachment:fixed}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
#balloons{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.bl{position:absolute;bottom:-120px;width:46px;height:58px;border-radius:50% 50% 48% 48%;opacity:.8;animation:rise linear infinite;box-shadow:inset -8px -8px 14px rgba(0,0,0,.25),0 0 18px currentColor}
.bl:after{content:"";position:absolute;left:50%;top:100%;width:1px;height:50px;background:#fff6}
@keyframes rise{to{transform:translateY(-125vh) translateX(40px) rotate(8deg)}}
section{position:relative;z-index:2;padding:56px 18px;max-width:900px;margin:auto;text-align:center}
.glass{background:rgba(255,255,255,.06);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);border-radius:22px;box-shadow:0 8px 40px rgba(0,0,0,.4)}
.neon{font-size:clamp(2rem,9vw,4.6rem);font-weight:900;line-height:1.1;color:#fff;text-shadow:0 0 8px var(--p),0 0 24px var(--p),0 0 54px var(--p);animation:glow 2.4s ease-in-out infinite alternate}
.neon.b{text-shadow:0 0 8px var(--b),0 0 24px var(--b),0 0 54px var(--b)}
@keyframes glow{from{filter:brightness(.9)}to{filter:brightness(1.25)}}
h2{font-size:clamp(1.4rem,5vw,2rem);margin-bottom:18px;color:var(--y);text-shadow:0 0 14px #ffe66d88}
.sub{opacity:.8;margin:10px 0 24px}
.btn{cursor:pointer;border:0;color:#fff;font-weight:700;padding:12px 22px;border-radius:999px;background:linear-gradient(135deg,var(--p),#7a5cff);box-shadow:0 0 20px #ff3cac88;transition:.2s;font-size:1rem}
.btn:hover{transform:translateY(-2px) scale(1.04)}.btn.alt{background:rgba(255,255,255,.1);box-shadow:none;border:1px solid #fff3}
#cd{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:26px 0}
.box{min-width:72px;padding:14px 8px}.box b{display:block;font-size:clamp(1.6rem,7vw,2.6rem);color:var(--b);text-shadow:0 0 14px var(--b)}.box small{opacity:.7;font-size:.7rem;letter-spacing:.15em}
#party{display:none}
/* cake */
.stage{height:300px;position:relative;margin:30px auto 10px;width:260px;cursor:pointer}
.tier{position:absolute;left:50%;transform:translateX(-50%);border-radius:14px 14px 10px 10px;box-shadow:0 0 30px #ff3cac55}
.t1{bottom:0;width:240px;height:90px;background:linear-gradient(#ff7eb6,#e0307f)}
.t2{bottom:90px;width:180px;height:80px;background:linear-gradient(#7ee8ff,#2a9bd6)}
.t3{bottom:170px;width:120px;height:60px;background:linear-gradient(#ffe66d,#f5a623)}
.drip{position:absolute;top:-2px;left:0;right:0;height:18px;background:#fff;border-radius:14px 14px 40% 40%/14px 14px 100% 100%}
.plate{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);width:290px;height:14px;border-radius:50%;background:#ddd;box-shadow:0 0 20px #fff6}
.candle{position:absolute;bottom:230px;width:8px;height:38px;border-radius:3px;background:repeating-linear-gradient(45deg,#fff,#fff 6px,#ff3cac 6px,#ff3cac 12px)}
.fl{position:absolute;left:50%;top:-22px;width:14px;height:22px;margin-left:-7px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(#fff,#ffd23f 50%,#ff7a00);box-shadow:0 0 18px 6px #ffb347;animation:fk .15s infinite alternate;transform-origin:bottom}
@keyframes fk{to{transform:scale(1.1,.9) rotate(4deg)}}
.out .fl{display:none}.out .candle:after{content:"";position:absolute;left:2px;top:-30px;width:4px;height:30px;background:linear-gradient(#fff8,transparent);animation:sm 2s forwards}
@keyframes sm{to{transform:translateY(-40px);opacity:0}}
/* gallery */
.frame{width:min(78vw,320px);aspect-ratio:1;border-radius:50%;margin:0 auto;padding:6px;background:conic-gradient(var(--p),var(--b),var(--y),var(--p));box-shadow:0 0 40px var(--p),0 0 80px #00e5ff55;animation:spin 8s linear infinite}
.frame img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#111}
@keyframes spin{to{filter:hue-rotate(360deg)}}
.dots{margin:16px 0}.dots i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#fff4;margin:0 4px;cursor:pointer}.dots i.on{background:var(--b);box-shadow:0 0 10px var(--b)}
/* wishes */
textarea,input[type=text]{width:100%;background:rgba(0,0,0,.35);border:1px solid #fff3;border-radius:12px;color:#fff;padding:12px;font:inherit;margin-bottom:10px}
.wish{padding:14px;margin:10px 0;text-align:left}.wish b{color:var(--b)}
#music{position:fixed;right:14px;bottom:14px;z-index:60;width:52px;height:52px;border-radius:50%;font-size:1.3rem;padding:0}
.twins{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
</style></head><body>
<canvas id="fx"></canvas><div id="balloons"></div>
<button class="btn" id="music" title="Music">🎵</button>

<section id="hero">
  <p class="sub" id="pre">✨ A surprise is loading for ✨</p>
  <h1 class="neon" id="title"></h1>
  <div id="cd"></div>
  <button class="btn alt" id="skip">🎉 Start the party now</button>
</section>

<section id="party">
  <h1 class="neon b" id="hb">Happy Birthday!</h1>
  <p class="sub" id="twin">Double the joy, double the fun 🎂🎂</p>
  <div class="stage" id="cake"><div class="plate"></div>
    <div class="tier t1"><div class="drip"></div></div><div class="tier t2"><div class="drip"></div></div><div class="tier t3"><div class="drip"></div></div></div>
  <p class="sub" id="hint">👆 Tap the cake to blow out the candles & make a wish!</p>
  <button class="btn alt" id="relight" style="display:none">🕯️ Light again</button>
</section>

<section id="mem" class="glass" style="display:none">
  <h2>📸 Memories</h2>
  <div class="frame"><img id="ph" alt="memory"></div>
  <div class="dots" id="dots"></div>
  <button class="btn alt" id="prev">‹</button> <button class="btn alt" id="next">›</button>
  <p class="sub"><label class="btn alt" style="display:inline-block">＋ Add photos<input id="up" type="file" accept="image/*" multiple hidden></label></p>
</section>

<section id="wsec" style="display:none">
  <h2>💌 Wishes</h2>
  <div class="glass wish" id="main"></div>
  <div class="glass" style="padding:18px;margin-top:18px">
    <input type="text" id="who" placeholder="Your name" maxlength="30">
    <textarea id="msg" rows="3" placeholder="Write a wish…" maxlength="300"></textarea>
    <button class="btn" id="send">Send wish 💖</button>
  </div>
  <div id="wall"></div>
</section>

<script>
'use strict';
/* ====== EDIT ME ====== */
const CFG = {
  names: ['Khademul', 'Twin Sister'],   // or use ?names=Khademul,Name in the URL
  date: '',                              // e.g. '2026-11-20T00:00:00' ; empty = next midnight. Or ?date=...
  photos: [],                            // add image URLs here (or use the "Add photos" button)
  from: 'Tamim',
  message: 'Tomader dujon ke jonmodiner onek onek shubhechchha! Tomader hashi, shopno ar bondhutto ei jibon ke aro shundor kore tulok. Tomra dujon-i amar jonno special. 💖 Happy Birthday!'
};
/* ===================== */
const $ = s => document.querySelector(s), q = new URLSearchParams(location.search);
if (q.get('names')) CFG.names = q.get('names').split(',').map(s => s.trim()).filter(Boolean).slice(0, 2);
let target = q.get('date') ? new Date(q.get('date')) : CFG.date ? new Date(CFG.date) : (() => { const d = new Date(); d.setHours(24, 0, 0, 0); return d; })();
if (isNaN(target)) { target = new Date(); target.setHours(24, 0, 0, 0); }
const NAMES = CFG.names.join(' & ');
$('#title').textContent = NAMES; document.title = 'Happy Birthday ' + NAMES + ' 🎂';
$('#hb').textContent = 'Happy Birthday ' + NAMES + '!';
$('#main').innerHTML = '<b></b><p style="margin-top:6px"></p>'; $('#main b').textContent = '💌 From ' + CFG.from; $('#main p').textContent = CFG.message;

/* countdown */
const parts = ['Days', 'Hours', 'Mins', 'Secs'];
$('#cd').innerHTML = parts.map(p => `<div class="glass box"><b>00</b><small>${p.toUpperCase()}</small></div>`).join('');
const boxes = [...document.querySelectorAll('.box b')];
let on = false;
function tick() {
  const d = target - Date.now();
  if (d <= 0) return celebrate();
  const v = [Math.floor(d / 864e5), Math.floor(d / 36e5) % 24, Math.floor(d / 6e4) % 60, Math.floor(d / 1e3) % 60];
  boxes.forEach((b, i) => b.textContent = String(v[i]).padStart(2, '0'));
}
setInterval(tick, 250); tick();
$('#skip').onclick = celebrate;
function celebrate() {
  if (on) return; on = true;
  $('#hero').style.display = 'none';
  ['party', 'mem', 'wsec'].forEach(id => $('#' + id).style.display = 'block');
  scrollTo(0, 0); show(0);
  let n = 0; const iv = setInterval(() => { firework(Math.random() * innerWidth, Math.random() * innerHeight * .5); if (++n > 18) clearInterval(iv); }, 500);
  confetti(60);
}

/* balloons */
const cols = ['#ff3cac', '#00e5ff', '#ffe66d', '#7a5cff', '#5cff9d', '#ff7a45'];
for (let i = 0; i < 14; i++) {
  const b = document.createElement('div'); b.className = 'bl';
  b.style.cssText = `left:${Math.random() * 96}%;background:${cols[i % 6]};color:${cols[i % 6]};animation-duration:${9 + Math.random() * 9}s;animation-delay:${-Math.random() * 14}s;transform:scale(${.7 + Math.random() * .7})`;
  $('#balloons').appendChild(b);
}

/* confetti + fireworks */
const cvs = $('#fx'), g = cvs.getContext('2d'); let P = [], run = false;
const fit = () => { cvs.width = innerWidth; cvs.height = innerHeight; }; addEventListener('resize', fit); fit();
function confetti(n, x, y) { for (let i = 0; i < n; i++) P.push({ x: x ?? Math.random() * cvs.width, y: y ?? -10, vx: (Math.random() - .5) * 6, vy: Math.random() * 3 + 2, g: .08, s: 4 + Math.random() * 5, c: cols[i % 6], l: 220, r: Math.random() * 6, sq: 1 }); loop(); }
function firework(x, y) { const c = cols[Math.floor(Math.random() * 6)]; for (let i = 0; i < 50; i++) { const a = Math.PI * 2 * i / 50, s = 2 + Math.random() * 3; P.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: .04, s: 2.5, c, l: 70, r: 0 }); } loop(); }
function loop() { if (run) return; run = true; (function f() { g.clearRect(0, 0, cvs.width, cvs.height); P = P.filter(p => p.l > 0 && p.y < cvs.height + 20); P.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += p.g; p.l--; p.r += .2; g.globalAlpha = Math.min(1, p.l / 40); g.fillStyle = p.c; g.shadowBlur = 10; g.shadowColor = p.c; if (p.sq) { g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); g.restore(); } else { g.beginPath(); g.arc(p.x, p.y, p.s, 0, 7); g.fill(); } }); if (P.length) requestAnimationFrame(f); else { run = false; g.clearRect(0, 0, cvs.width, cvs.height); } })(); }
addEventListener('pointerdown', e => { if (on) firework(e.clientX, e.clientY); });

/* cake */
const cake = $('#cake'), cands = [];
for (let i = 0; i < 5; i++) { const c = document.createElement('div'); c.className = 'candle'; c.style.left = (70 + i * 30) + 'px'; c.innerHTML = '<div class="fl"></div>'; cake.appendChild(c); cands.push(c); }
cake.onclick = () => {
  if (cake.classList.contains('out')) return;
  cake.classList.add('out'); $('#relight').style.display = 'inline-block'; $('#hint').textContent = '🎉 Wish granted! Happy Birthday! 🎉';
  cheer(); confetti(160, innerWidth / 2, innerHeight / 3);
  for (let i = 0; i < 5; i++) setTimeout(() => firework(Math.random() * innerWidth, Math.random() * innerHeight * .5), i * 250);
};
$('#relight').onclick = () => { cake.classList.remove('out'); $('#relight').style.display = 'none'; $('#hint').textContent = '👆 Tap the cake to blow out the candles!'; };

/* gallery */
const mk = (e, a, b) => 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="400" height="400" fill="url(#g)"/><text x="200" y="250" font-size="150" text-anchor="middle">${e}</text></svg>`);
let pics = CFG.photos.length ? [...CFG.photos] : [mk('🎂', '#ff3cac', '#7a5cff'), mk('🎈', '#00e5ff', '#7a5cff'), mk('🎁', '#ffe66d', '#ff3cac'), mk('🥳', '#5cff9d', '#00e5ff')], cur = 0, auto;
function show(i) { cur = (i + pics.length) % pics.length; $('#ph').src = pics[cur]; $('#dots').innerHTML = pics.map((_, k) => `<i class="${k === cur ? 'on' : ''}" data-k="${k}"></i>`).join(''); }
$('#dots').onclick = e => e.target.dataset.k && show(+e.target.dataset.k);
$('#prev').onclick = () => show(cur - 1); $('#next').onclick = () => show(cur + 1);
setInterval(() => { if (on) show(cur + 1); }, 4000);
$('#up').onchange = e => { const f = [...e.target.files]; if (!f.length) return; if (!CFG.photos.length && pics[0].startsWith('data:image/svg')) pics = []; f.forEach(x => { const r = new FileReader(); r.onload = () => { pics.push(r.result); show(pics.length - 1); }; r.readAsDataURL(x); }); };
show(0);

/* wishes (stored on this device only) */
let wishes = []; try { wishes = JSON.parse(localStorage.bdWishes || '[]'); } catch (e) {}
function draw() { $('#wall').innerHTML = ''; wishes.slice().reverse().forEach(w => { const d = document.createElement('div'); d.className = 'glass wish'; const b = document.createElement('b'), p = document.createElement('p'); b.textContent = w.n; p.textContent = w.m; d.append(b, p); $('#wall').appendChild(d); }); }
$('#send').onclick = () => { const m = $('#msg').value.trim(); if (!m) return; wishes.push({ n: $('#who').value.trim() || 'Friend', m }); try { localStorage.bdWishes = JSON.stringify(wishes.slice(-50)); } catch (e) {} $('#msg').value = ''; draw(); confetti(50); };
draw();

/* music: synthesized Happy Birthday (no files needed) */
let ac, master, playing = false, tm;
const N = { C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392, A4: 440, Bb4: 466.16, C5: 523.25 };
const tune = [['C4', .75], ['C4', .25], ['D4', 1], ['C4', 1], ['F4', 1], ['E4', 2], ['C4', .75], ['C4', .25], ['D4', 1], ['C4', 1], ['G4', 1], ['F4', 2], ['C4', .75], ['C4', .25], ['C5', 1], ['A4', 1], ['F4', 1], ['E4', 1], ['D4', 2], ['Bb4', .75], ['Bb4', .25], ['A4', 1], ['F4', 1], ['G4', 1], ['F4', 2]];
function note(f, t, d, out) { const o = ac.createOscillator(), v = ac.createGain(); o.type = 'triangle'; o.frequency.value = f; v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(.25, t + .03); v.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(v); v.connect(out); o.start(t); o.stop(t + d + .05); }
function init() { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); }
function play() { if (!playing) return; master = ac.createGain(); master.gain.value = .5; master.connect(ac.destination); let t = ac.currentTime + .1; const bt = .5; tune.forEach(([n, d]) => { note(N[n], t, d * bt * .95, master); t += d * bt; }); tm = setTimeout(play, (t - ac.currentTime + 1.5) * 1000); }
$('#music').onclick = () => { init(); playing = !playing; $('#music').textContent = playing ? '🔊' : '🎵'; if (playing) play(); else { clearTimeout(tm); if (master) master.disconnect(); } };
function cheer() { try { init(); [523, 659, 784, 1047].forEach((f, i) => note(f, ac.currentTime + i * .09, .5, ac.destination)); } catch (e) {} }
</script></body></html>
